<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>TruthLens AI APK Download</title>

<style>

body{
font-family: Arial, sans-serif;
max-width:900px;
margin:auto;
padding:40px;
background:#f5f5f5;
}

h1{
font-size:36px;
}

.card{
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.download-btn{
display:inline-block;
padding:10px 18px;
background:#007bff;
color:white;
text-decoration:none;
border-radius:6px;
margin-top:10px;
}

.version{
margin-top:15px;
padding:10px;
border-bottom:1px solid #ddd;
}

</style>
</head>

<body>

<h1>TruthLens.AI</h1>

<p>
TruthLens AI is a deepfake detection Android application developed by Atharva Pathak and Harsh Dharnidharka.
It analyzes images and determines whether images are authentic or AI-manipulated.
</p>

<div class="card">

<h2>Latest Version</h2>

<div id="latest">
Loading latest release...
</div>

</div>


<div class="card">

<h2>All Versions</h2>

<div id="versions">
Loading releases...
</div>

</div>


<script>

async function loadReleases(){

const response = await fetch(
"https://api.github.com/repos/athaxva/athaxva.github.io/releases"
);

const releases = await response.json();

let latestHTML = "";
let versionsHTML = "";

releases.forEach((release,index)=>{

const asset = release.assets.find(a => a.name.endsWith(".apk"));

if(!asset) return;

const block = `
<div class="version">

<strong>${release.tag_name}</strong><br>

${release.body || ""}

<br>

<a class="download-btn" href="${asset.browser_download_url}">
Download APK
</a>

</div>
`;

versionsHTML += block;

if(index === 0){
latestHTML = block;
}

});

document.getElementById("latest").innerHTML = latestHTML;
document.getElementById("versions").innerHTML = versionsHTML;

}

loadReleases();

</script>

</body>

</html>
