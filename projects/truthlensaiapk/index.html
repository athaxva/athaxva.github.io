<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TruthLensAI — APK Download</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0a0a0f;
  --surface:#111118;
  --surface2:#18181f;
  --border:rgba(255,255,255,0.07);
  --accent:#00e5ff;
  --accent2:#7b5ea7;
  --text:#e8e8f0;
  --muted:#6b6b80;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:'DM Mono',monospace;
  background:var(--bg);
  color:var(--text);
}

.wrapper{
  max-width:860px;
  margin:auto;
  padding:60px 24px;
}

.logo-row{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:20px;
}

.logo-icon{
  width:44px;height:44px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
}

h1{
  font-family:'Syne',sans-serif;
  font-size:38px;
}

.brand-ai{color:var(--accent);}

.badge{
  display:inline-block;
  padding:4px 12px;
  border-radius:100px;
  font-size:11px;
  color:var(--accent);
  border:1px solid rgba(0,229,255,0.3);
  margin-bottom:16px;
}

.description{
  font-size:14px;
  color:var(--muted);
  line-height:1.7;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  margin-top:20px;
}

.card-label{
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:16px;
  cursor:pointer;
}

.version-block{
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
}

.version-tag{
  font-family:'Syne';
  font-size:16px;
}

.version-notes{
  font-size:12px;
  color:var(--muted);
}

.dl-btn{
  background:var(--accent);
  color:#000;
  padding:8px 14px;
  border-radius:6px;
  text-decoration:none;
  font-size:12px;
}

#versions{
  display:none;
  transition:0.3s;
}
</style>
</head>

<body>
<div class="wrapper">

<header>
  <div class="logo-row">
    <div class="logo-icon">🔍</div>
    <h1>TruthLens<span class="brand-ai">AI</span></h1>
  </div>

  <div class="badge">Android App</div>

  <p class="description">
    Deepfake detection app by <strong>Atharva Pathak</strong> and 
    <strong>Harsh Dharnidharka</strong>.
  </p>
</header>

<!-- ✅ Latest -->
<div class="card">
  <div class="card-label">Latest Release</div>
  <div id="latest">Loading...</div>
</div>

<!-- ✅ Collapsible Versions -->
<div class="card">

  <div class="card-label" id="toggleBtn" onclick="toggleVersions()">
    All Versions ▼
  </div>

  <div id="versions">
    <p class="description">Click to load versions...</p>
  </div>

</div>

</div>

<script>
let versionsLoaded = false;
let versionsVisible = false;
let allVersionsHTML = "";

async function loadReleases(){
  const res = await fetch("https://api.github.com/repos/athaxva/athaxva.github.io/releases");
  const releases = await res.json();

  let latestHTML = "";
  let versionsHTML = "";

  releases.forEach((release,i)=>{
    const asset = release.assets.find(a=>a.name.endsWith(".apk"));
    if(!asset) return;

    const notes = release.body || "";

    if(i===0){
      latestHTML = `
        <div class="version-block">
          <div>
            <div class="version-tag">${release.tag_name}</div>
            <div class="version-notes">${notes}</div>
          </div>
          <a class="dl-btn" href="${asset.browser_download_url}">
            Download
          </a>
        </div>`;
    }

    versionsHTML += `
      <div class="version-block">
        <div>
          <div class="version-tag">${release.tag_name}</div>
          <div class="version-notes">${notes}</div>
        </div>
        <a class="dl-btn" href="${asset.browser_download_url}">
          APK
        </a>
      </div>`;
  });

  document.getElementById("latest").innerHTML = latestHTML;
  allVersionsHTML = versionsHTML;
}

function toggleVersions(){
  const box = document.getElementById("versions");
  const btn = document.getElementById("toggleBtn");

  versionsVisible = !versionsVisible;

  if(versionsVisible){
    box.style.display = "block";
    btn.innerText = "All Versions ▲";

    if(!versionsLoaded){
      box.innerHTML = allVersionsHTML;
      versionsLoaded = true;
    }

  } else {
    box.style.display = "none";
    btn.innerText = "All Versions ▼";
  }
}

loadReleases();
</script>

</body>
</html>
