<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TruthLens AI — APK Download</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --border: rgba(255,255,255,0.07);
    --accent: #00e5ff;
    --accent2: #7b5ea7;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --success: #00c896;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow orb */
  body::after {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(0,229,255,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 60px 32px 80px;
  }

  /* Header */
  .header {
    margin-bottom: 56px;
    animation: fadeUp 0.6s ease both;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(0,229,255,0.3);
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(90deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 500;
  }

  .description {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.8;
    max-width: 580px;
    font-family: 'DM Mono', monospace;
    font-weight: 300;
  }

  .description strong {
    color: var(--text);
    font-weight: 500;
  }

  /* Pill badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    background: rgba(0,229,255,0.08);
    border: 1px solid rgba(0,229,255,0.2);
    border-radius: 100px;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .badge-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: pulse 2s infinite;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 32px;
    margin-bottom: 20px;
    animation: fadeUp 0.6s ease both;
  }

  .card:nth-child(2) { animation-delay: 0.1s; }
  .card:nth-child(3) { animation-delay: 0.2s; }

  .card-label {
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Version blocks */
  .version-block {
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: start;
  }

  .version-block:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .version-block:first-child {
    padding-top: 0;
  }

  .version-tag {
    font-family: 'Syne', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }

  .version-notes {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
    font-weight: 300;
    white-space: pre-wrap;
    max-width: 480px;
  }

  /* Latest block styling */
  .latest-block {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .latest-info .version-tag {
    font-size: 26px;
    margin-bottom: 8px;
  }

  /* Download button */
  .dl-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: var(--accent);
    color: #000;
    text-decoration: none;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
    transition: all 0.2s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .dl-btn:hover {
    background: #fff;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(0,229,255,0.25);
  }

  .dl-btn svg {
    width: 14px; height: 14px;
  }

  .dl-btn-sm {
    padding: 7px 14px;
    font-size: 11px;
    background: transparent;
    color: var(--accent);
    border: 1px solid rgba(0,229,255,0.3);
  }

  .dl-btn-sm:hover {
    background: rgba(0,229,255,0.08);
    color: var(--accent);
    box-shadow: 0 4px 14px rgba(0,229,255,0.1);
  }

  /* Loading / skeleton */
  .loading {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
    padding: 12px 0;
  }

  .skeleton {
    height: 14px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--surface2) 25%, #202030 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    margin-bottom: 10px;
  }

  /* Footer */
  .footer {
    margin-top: 48px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
    animation: fadeUp 0.6s 0.3s ease both;
  }

  .footer a {
    color: var(--accent);
    text-decoration: none;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes shimmer {
    to { background-position: -200% 0; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  /* Error */
  .error-msg {
    font-size: 12px;
    color: #ff6b6b;
    padding: 12px 0;
  }
</style>
</head>
<body>
<div class="wrapper">

  <header class="header">
    <div class="logo-row">
      <div class="logo-icon">🔍</div>
      <h1>TruthLens.AI</h1>
    </div>
    <div class="badge"><span class="badge-dot"></span> Android App</div>
    <p class="description">
      Deepfake detection for Android, developed by
      <strong>Atharva Pathak</strong> and <strong>Harsh Dharnidharka</strong>.
      Analyzes images to determine whether they are authentic or AI-manipulated.
    </p>
  </header>

  <div class="card" id="card-latest">
    <div class="card-label">Latest Release</div>
    <div id="latest">
      <div class="skeleton" style="width:120px; height:20px;"></div>
      <div class="skeleton" style="width:260px;"></div>
      <div class="skeleton" style="width:180px;"></div>
    </div>
  </div>

  <div class="card" id="card-versions">
    <div class="card-label">All Versions</div>
    <div id="versions">
      <div class="skeleton" style="width:80px; height:16px;"></div>
      <div class="skeleton" style="width:300px;"></div>
      <div class="skeleton" style="width:80px; height:16px; margin-top:18px;"></div>
      <div class="skeleton" style="width:220px;"></div>
    </div>
  </div>

  <div class="footer">
    Releases fetched from <a href="https://github.com/athaxva/athaxva.github.io" target="_blank">github.com/athaxva/athaxva.github.io</a>
  </div>

</div>

<script>
  const dlIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;

  async function loadReleases() {
    try {
      const response = await fetch(
        "https://api.github.com/repos/athaxva/athaxva.github.io/releases"
      );
      const releases = await response.json();

      let latestHTML = "";
      let versionsHTML = "";

      releases.forEach((release, index) => {
        const asset = release.assets.find(a => a.name.endsWith(".apk"));
        if (!asset) return;

        const notes = (release.body || "").trim();

        if (index === 0) {
          latestHTML = `
            <div class="latest-block">
              <div class="latest-info">
                <div class="version-tag">${release.tag_name}</div>
                ${notes ? `<div class="version-notes">${notes}</div>` : ''}
              </div>
              <a class="dl-btn" href="${asset.browser_download_url}">
                ${dlIcon} Download APK
              </a>
            </div>`;
        }

        versionsHTML += `
          <div class="version-block">
            <div>
              <div class="version-tag">${release.tag_name}</div>
              ${notes ? `<div class="version-notes">${notes}</div>` : ''}
            </div>
            <a class="dl-btn dl-btn-sm" href="${asset.browser_download_url}">
              ${dlIcon} APK
            </a>
          </div>`;
      });

      document.getElementById("latest").innerHTML =
        latestHTML || '<p class="loading">No releases found.</p>';
      document.getElementById("versions").innerHTML =
        versionsHTML || '<p class="loading">No releases found.</p>';

    } catch (err) {
      const msg = `<p class="error-msg">Failed to load releases. Check your connection.</p>`;
      document.getElementById("latest").innerHTML = msg;
      document.getElementById("versions").innerHTML = msg;
    }
  }

  loadReleases();
</script>
</body>
</html>
